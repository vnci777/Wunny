<style>
/* Layout: clean white canvas with a soft sky glow and fading grid (same world as the survey banner);
   home = today's lesson + streak beside the A1 path; lessons = one centred working column with an answer bar. */
:root{
  --bg:#ffffff; --card:#ffffff; --tint:#eef6ff; --tint-2:#e0edff;
  --ink:#0b1b33; --muted:#56677d; --faint:#8494a8;
  --line:rgba(22,110,240,.14); --line-2:rgba(22,110,240,.26);
  --blue:#1677f2; --blue-d:#0b58c9; --sky:#38a8ff; --teal:#3fd0dc; --teal-d:#0b7f8c;
  --good:#118a6d; --good-bg:#eaf8f3; --good-line:#a6dfcc;
  --bad:#c93b46; --bad-bg:#fff1f1; --bad-line:#f3b8bc;
  --grad:linear-gradient(95deg,#1673f0 0%,#3aa7ff 52%,#3fd0dc 100%);
  --f-ui:"Inter","Noto Sans HK",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-han:"Noto Sans HK","PingFang HK","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-optical-sizing:auto}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* backdrop */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sky::before{content:"";position:absolute;width:980px;height:980px;right:-300px;top:-380px;border-radius:50%;
  background:radial-gradient(circle,rgba(70,160,255,.42) 0%,rgba(110,190,255,.18) 40%,rgba(255,255,255,0) 68%)}
.sky::after{content:"";position:absolute;width:760px;height:560px;left:-280px;bottom:-320px;border-radius:50%;
  background:radial-gradient(circle,rgba(63,208,220,.26) 0%,rgba(255,255,255,0) 65%)}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(22,110,240,.065) 1px,transparent 1px),linear-gradient(90deg,rgba(22,110,240,.065) 1px,transparent 1px);
  background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 60% 55% at 78% 0%,#000 0%,transparent 75%);mask-image:radial-gradient(ellipse 60% 55% at 78% 0%,#000 0%,transparent 75%)}
.view{position:relative;z-index:1}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* shared atoms */
.pill{display:inline-flex;align-items:center;gap:10px;padding:7px 15px 7px 11px;border-radius:999px;background:rgba(255,255,255,.8);
  border:1px solid rgba(22,119,242,.25);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 8px 22px -12px rgba(22,119,242,.45);
  font-weight:600;font-size:14px;letter-spacing:-.01em;color:#0b58c9;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#1f8bff;box-shadow:0 0 0 4px rgba(31,139,255,.2);flex:none}
.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border:0;border-radius:999px;
  background:linear-gradient(180deg,#2b8dff,#1677f2);color:#fff;font-weight:700;font-size:17px;letter-spacing:-.01em;
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 4px 0 var(--blue-d),0 14px 24px -12px rgba(22,119,242,.7);transition:transform .08s,box-shadow .08s,opacity .2s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 1px 0 var(--blue-d)}
.btn:disabled{background:#dfe8f2;color:#8c9cb0;box-shadow:0 4px 0 #c9d5e2;cursor:not-allowed;transform:none}
.btn.ok{background:linear-gradient(180deg,#19a582,#118a6d);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 4px 0 #0b6a53}
.btn.no{background:linear-gradient(180deg,#dc5560,#c93b46);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 4px 0 #9e2a34}
.ghost{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line-2);background:#fff;
  color:var(--blue-d);font-weight:650;font-size:15px;box-shadow:0 2px 0 var(--line-2)}
.ghost:active{transform:translateY(2px);box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.85);
  font-weight:750;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink)}
.chip small{font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.85);display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:20px;height:20px}
.tn{font-size:.62em;vertical-align:.55em;margin-left:1px;color:var(--teal-d);font-weight:700}
.han{font-family:var(--f-han)}

/* home */
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:16px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none}
.brand img{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);object-fit:cover}
.brand b{font-size:23px;font-weight:800;letter-spacing:-.04em;color:var(--teal-d)}
.flame{width:20px;height:20px;flex:none}
.home{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;padding-block:6px 56px}
@media (min-width:940px){.home{grid-template-columns:minmax(0,1.04fr) minmax(0,1fr);gap:40px;align-items:start}.col-a{position:sticky;top:16px}}
.col-a{display:flex;flex-direction:column;gap:18px;min-width:0}
.today{--pw:172px;position:relative;margin-top:100px;padding:30px 28px 28px;border-radius:30px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(243,248,254,.92));box-shadow:0 40px 70px -48px rgba(22,119,242,.55)}
/* Wunny peeking: the head rises from behind the edge it sits on, then each paw reaches up from under the edge and hooks over it.
   Layer geometry comes from the artwork: head height = 55.62% of width; paws hang 3.78% / 4.49% of width below the edge. */
.peek{position:absolute;bottom:100%;width:var(--pw);height:calc(var(--pw) * .5562);pointer-events:none}
.peek .ph{position:absolute;inset:0;overflow:hidden}
/* fully hidden under the edge until the artwork has loaded (.go), then peekaboo */
.peek .ph img{width:100%;transform:translateY(102%);transform-origin:50% 100%}
.peek .paw{position:absolute;clip-path:inset(0 0 100% 0)}
.peek.go .ph img{transform:none;animation:peekaboo 1.8s cubic-bezier(.3,.7,.3,1) var(--dh,.5s) both, headBob 8s ease-in-out calc(var(--dh,.5s) + 5s) infinite}
.peek.go .paw{clip-path:inset(0 0 0 0);animation:reach .85s cubic-bezier(.33,.7,.35,1) var(--dp) both, pawTap 8s ease-in-out calc(var(--dp) + 3.2s) infinite}
.peek .paw.l{left:0;width:16.335%;bottom:calc(var(--pw) * -.0378);--D:42.75%;--dp:calc(var(--dh,.5s) + 1.65s)}
.peek .paw.r{left:83.06%;width:16.94%;bottom:calc(var(--pw) * -.0449);--D:50.76%;--dp:calc(var(--dh,.5s) + 1.83s)}
.barpeek.go .ph img{animation:headUp .55s cubic-bezier(.2,.85,.3,1) both}
.barpeek .paw.l{--dp:.3s}
.barpeek .paw.r{--dp:.42s}
.peek.go.out .ph img{animation:headDown .45s ease-in .12s forwards}
.peek.go.out .paw{animation:letGo .4s ease-in forwards}
.today .peek{right:48px;z-index:2}
.fx{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:0}
.fx span{position:absolute;left:var(--x);top:var(--y);font-family:var(--f-han);font-weight:800;font-size:var(--s);line-height:1;color:rgba(22,119,242,.075);
  white-space:nowrap;animation:floaty var(--d) ease-in-out var(--dl) infinite alternate}
@media (max-width:520px){.fx span{font-size:calc(var(--s) * .7)}}
.today>*:not(.fx):not(.peek):not(.side){position:relative;z-index:1}
.today .side{position:absolute;right:20px;bottom:18px;width:120px;pointer-events:none}
.today h1{margin:18px 0 0;font-size:clamp(34px,5.2vw,52px);line-height:1.02;letter-spacing:-.045em;font-weight:780;text-wrap:balance}
.today p.lead{margin:14px 0 0;font-size:18px;color:var(--muted);max-width:44ch;letter-spacing:-.012em}
.wchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.wchip{font-family:var(--f-han);font-weight:700;font-size:17px;padding:6px 12px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.today .btn{margin-top:24px}
.today.rest{padding-right:150px}
@media (max-width:520px){.today{--pw:136px;margin-top:86px;padding:26px 20px 22px}.today .peek{right:30px}.today.rest{padding-right:20px;padding-bottom:150px}}
.streak{padding:22px 24px;border-radius:24px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:18px}
.streak-top{display:flex;align-items:center;gap:16px}
.streak-top .flame{width:52px;height:52px}
.snum{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.slab{font-weight:650;color:var(--muted);font-size:15px}
.sbest{margin-left:auto;text-align:right;color:var(--muted);font-size:13px;line-height:1.35}
.sbest b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.week{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week li{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--faint)}
.week i{width:32px;height:32px;border-radius:50%;background:var(--tint-2);display:grid;place-items:center;color:#fff}
.week i svg{width:16px;height:16px}
.week li.on i{background:var(--grad);box-shadow:0 6px 14px -6px rgba(22,119,242,.7)}
.week li.now span{color:var(--blue-d)}
.week li.now i{outline:2px solid var(--blue);outline-offset:2px}
.note{display:flex;gap:16px;align-items:flex-start;padding:18px 20px;border-radius:22px;background:var(--tint);border:1px solid var(--line)}
.note img{width:64px;flex:none}
.note h3{margin:0;font-size:17px;letter-spacing:-.02em}
.note p{margin:4px 0 0;color:var(--muted);font-size:14px}
.note ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px;display:grid;gap:3px}
.path-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.path-head h2{margin:0;font-size:30px;letter-spacing:-.04em;line-height:1.1;font-weight:780}
.path-head p{margin:6px 0 0;color:var(--muted);max-width:46ch}
.meter{height:8px;border-radius:99px;background:var(--tint-2);overflow:hidden;margin:18px 0 6px}
.meter span{display:block;height:100%;background:var(--grad);border-radius:inherit}
.unit{margin-top:26px}
.unit-h{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
.unit-h small{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-d)}
.unit-h b{font-size:19px;letter-spacing:-.02em}
.unit-h em{margin-left:auto;font-style:normal;font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.lessons{list-style:none;margin:0;padding:0}
.lrow{position:relative;display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 0}
.lrow+.lrow::before{content:"";position:absolute;left:22px;top:-12px;height:24px;width:2px;background:var(--tint-2)}
.node{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-variant-numeric:tabular-nums;position:relative;z-index:1;
  background:#fff;border:2px solid var(--tint-2);color:var(--faint)}
.node svg{width:20px;height:20px}
.lrow.done .node{background:var(--grad);border-color:transparent;color:#fff}
.lrow.open .node{border-color:var(--blue);color:var(--blue-d);box-shadow:0 0 0 5px rgba(31,139,255,.15)}
.ltxt{min-width:0}
.ltxt b{display:block;font-size:16.5px;letter-spacing:-.02em}
.ltxt span{display:block;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ltxt span.han{font-size:13.5px;color:var(--faint)}
.mini{min-height:38px;padding:0 16px;font-size:14px}
.soon{font-size:13px;font-weight:650;color:var(--faint);white-space:nowrap}
.foot{padding-block:8px 32px;color:var(--faint);font-size:13px}
.preview-tag{font-size:12px;font-weight:700;color:var(--teal-d)}

/* lesson */
#lesson{height:100%;display:flex;flex-direction:column}
.lhead .wrap{max-width:760px;display:flex;align-items:center;gap:14px;padding-block:14px}
.prog{flex:1;height:14px;border-radius:99px;background:var(--tint-2);overflow:hidden}
.prog span{display:block;height:100%;width:0;background:var(--grad);border-radius:inherit;transition:width .45s cubic-bezier(.2,.8,.2,1);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.combo{font-weight:800;font-size:14px;color:var(--teal-d);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:0}
.combo.pop{animation:pop .4s}
.stage{flex:1;overflow-y:auto}
.stage .wrap{max-width:660px;padding-block:18px 36px;display:flex;flex-direction:column;gap:20px}
.stage .wrap>*{animation:stepIn .45s cubic-bezier(.2,.8,.2,1) both}
.stage .wrap>*:nth-child(2){animation-delay:.05s}
.stage .wrap>*:nth-child(3){animation-delay:.1s}
.stage .wrap>*:nth-child(4){animation-delay:.15s}
.qtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qh{margin:0;font-size:clamp(24px,4.2vw,31px);line-height:1.15;letter-spacing:-.035em;font-weight:760;text-wrap:balance}
.qh:focus{outline:none}
.lead{margin:0;color:var(--muted);font-size:17px}
.word{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:30px 22px 26px;border-radius:26px;border:1px solid var(--line);
  background:linear-gradient(180deg,#fff,#f1f7ff);box-shadow:0 30px 50px -44px rgba(22,119,242,.6)}
.word .zh{font-family:var(--f-han);font-weight:800;font-size:clamp(46px,11vw,76px);line-height:1.12;letter-spacing:.02em;overflow-wrap:anywhere}
.word.compact{padding:22px}
.word.compact .zh{font-size:clamp(40px,9vw,60px)}
.word .jp{font-size:21px;color:var(--blue-d);font-weight:650;letter-spacing:.01em}
.word .en{font-size:18px;color:var(--muted)}
.audio{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:10px}
.spk{width:52px;height:52px;border-radius:50%;border:0;background:linear-gradient(180deg,#2b8dff,#1677f2);color:#fff;display:grid;place-items:center;
  box-shadow:0 3px 0 var(--blue-d),0 10px 18px -10px rgba(22,119,242,.8);flex:none}
.spk svg{width:24px;height:24px}
.spk.sm{width:38px;height:38px;box-shadow:0 2px 0 var(--blue-d)}
.spk.sm svg{width:18px;height:18px}
.spk:active{transform:translateY(2px);box-shadow:none}
.spk.on{animation:ring 1s ease-out infinite}
.slow{min-height:38px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line-2);background:#fff;color:var(--blue-d);font-weight:650;font-size:14px}
.listen{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(180deg,#fff,#f1f7ff);position:relative;overflow:hidden}
.bigplay{width:104px;height:104px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 var(--blue-d),0 24px 40px -18px rgba(22,119,242,.8)}
.bigplay svg{width:44px;height:44px}
.bigplay:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-d)}
.bigplay.on{animation:ring 1s ease-out infinite}
.listen .det{position:absolute;left:-8px;bottom:-26px;width:96px;opacity:.95}
.opts{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:560px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;min-height:64px;border-radius:18px;border:1.5px solid var(--line-2);
  background:#fff;box-shadow:0 3px 0 var(--line-2);transition:background .15s,border-color .15s,transform .08s}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line-2)}
.opt .key{width:28px;height:28px;border-radius:9px;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:13px;color:var(--faint);font-weight:750;flex:none}
.opt[aria-checked="true"]{border-color:var(--blue);background:#eaf4ff;box-shadow:0 3px 0 var(--blue)}
.opt[aria-checked="true"] .key{border-color:var(--blue);color:var(--blue-d);background:#fff}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:0 3px 0 var(--good)}
.opt.right .key{border-color:var(--good);background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 3px 0 var(--bad);animation:shake .35s}
.opt.wrong .key{border-color:var(--bad);background:var(--bad);color:#fff}
.opt:disabled{cursor:default;color:var(--ink);opacity:1}
.olab{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;min-width:0}
.oen{font-size:17px;font-weight:600;letter-spacing:-.01em}
.ozh{font-family:var(--f-han);font-size:25px;font-weight:800}
.ojp{color:var(--muted);font-size:15px;font-weight:550}
.sent{padding:24px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(180deg,#fff,#f1f7ff);display:flex;flex-direction:column;gap:8px}
.szh{font-family:var(--f-han);font-size:clamp(26px,6vw,34px);font-weight:700;line-height:1.35}
.blank{display:inline-block;min-width:2.2em;border-bottom:3px dashed var(--sky);margin:0 4px;vertical-align:-2px;height:1.05em}
.szh mark{background:none;color:var(--blue-d);border-bottom:3px solid var(--teal);padding:0 2px}
.sjp{color:var(--blue-d);font-weight:600;font-size:17px}
.sen{color:var(--muted);font-size:17px}
.startcard{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px 22px;align-items:end}
.startcard .art{grid-row:1/3;grid-column:2;align-self:start}
@media (max-width:520px){.startcard{grid-template-columns:minmax(0,1fr)}.startcard .art{grid-row:auto;grid-column:auto;width:130px}}
.tip{padding:18px 20px;border-radius:20px;background:var(--tint);border:1px solid var(--line)}
.tip strong{display:block;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--teal-d);margin-bottom:4px}
.tip p{margin:0;font-size:16.5px}
.speak-art{width:120px;margin:0 auto}

/* answer bar */
.bar{border-top:1px solid var(--line);background:#fff;transition:background .2s,border-color .2s}
.bar .wrap{max-width:760px;display:flex;align-items:center;gap:14px 18px;padding-block:16px;flex-wrap:wrap}
.bar.good{background:var(--good-bg);border-color:var(--good-line)}
.bar.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.fb{flex:1 1 280px;min-width:0;display:flex;gap:14px;align-items:center}
.fb:empty{display:none}
.fb-ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;animation:pop .35s}
.fb-ic svg{width:24px;height:24px}
.bar.good .fb-ic{background:var(--good)}
.bar.bad .fb-ic{background:var(--bad)}
.fb-t{min-width:0}
.fb-t strong{display:block;font-size:20px;letter-spacing:-.02em}
.bar.good .fb-t strong{color:var(--good)}
.bar.bad .fb-t strong{color:var(--bad)}
.fb-t>span{font-size:15px;color:var(--ink)}
.fzh{font-family:var(--f-han);font-weight:800;font-size:18px}
.acts{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.acts{width:100%;margin-left:0}.acts .btn{flex:1}.acts .ghost{flex:1;justify-content:center}}

/* done */
#done .wrap{max-width:620px;padding-block:28px 56px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
.done-art{width:190px;animation:rise .5s ease both}
.bigstreak{display:flex;align-items:center;gap:12px}
.bigstreak .flame{width:58px;height:58px;animation:pop .6s .2s both}
.bigstreak b{font-size:64px;font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
#done h1{margin:0;font-size:clamp(32px,6vw,46px);letter-spacing:-.045em;line-height:1.05;font-weight:780}
#done .lead{max-width:42ch}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.stat{padding:14px 10px;border-radius:18px;border:1px solid var(--line);background:#fff}
.stat b{display:block;font-size:24px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.wlist{list-style:none;margin:0;padding:0;width:100%;display:grid;gap:8px;text-align:left}
.wlist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:#fff}
.wlist .han{font-weight:800;font-size:20px}
.wlist .m{min-width:0;font-size:14px;color:var(--muted)}
.wlist .m span{display:block}

/* dialogs */
dialog{border:0;padding:0;border-radius:26px;width:min(520px,calc(100vw - 32px));max-height:calc(100% - 32px);color:var(--ink);background:#fff;
  box-shadow:0 40px 80px -30px rgba(11,27,51,.45)}
dialog::backdrop{background:rgba(11,27,51,.32);backdrop-filter:blur(3px)}
dialog[open]{animation:rise .25s ease both}
.dlg{padding:24px;display:flex;flex-direction:column;gap:14px}
.dlg-h{display:flex;align-items:center;gap:12px}
.dlg-h h2{margin:0;font-size:22px;letter-spacing:-.03em;margin-right:auto}
.ctx-art{width:110px;align-self:center}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row label{font-weight:600}
.set-row small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.set-row input{width:22px;height:22px;accent-color:var(--blue);flex:none}
.vstat{font-size:14px;color:var(--muted)}
.set-row select{max-width:58%;min-height:42px;padding:0 10px;border-radius:12px;border:1.5px solid var(--line-2);background:#fff;color:var(--ink);font:inherit;font-size:14px}
.danger{color:var(--bad);border-color:var(--bad-line);box-shadow:0 2px 0 var(--bad-line)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* sign-up pop-up */
.gate-card,.inp,.rule,.tile,.tbl-wrap{box-sizing:border-box}
#authDlg{width:min(480px,calc(100vw - 32px));max-height:calc(100% - 12px);overflow-x:hidden;overflow-y:auto;background:transparent;box-shadow:none;padding:112px 0 16px;border-radius:0}
#authDlg::backdrop{background:rgba(11,27,51,.38);backdrop-filter:blur(6px)}
.gate-card{--pw:150px;position:relative;width:100%;padding:28px 26px 26px;border-radius:30px;border:1px solid var(--line);
  background:linear-gradient(180deg,#fff,#f1f7ff);box-shadow:0 40px 80px -36px rgba(11,27,51,.45)}
.gate-card .peek{left:calc(50% - var(--pw) / 2);z-index:2}
#gIn{display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
#gIn>*{animation:stepIn .45s cubic-bezier(.2,.8,.2,1) backwards}
#gIn>*:nth-child(2){animation-delay:.04s}#gIn>*:nth-child(3){animation-delay:.08s}#gIn>*:nth-child(4){animation-delay:.12s}#gIn>*:nth-child(5){animation-delay:.16s}
#gIn h2{margin:0;font-size:clamp(30px,6.4vw,40px);line-height:1.05;letter-spacing:-.045em;font-weight:780;text-wrap:balance}
#gIn .pill{align-self:flex-start}
.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:var(--tint-2)}
.tabs button{min-height:42px;border:0;border-radius:999px;background:transparent;font-weight:700;font-size:15px;color:var(--muted);transition:background .2s,color .2s}
.tabs button[aria-selected="true"]{background:#fff;color:var(--blue-d);box-shadow:0 2px 10px -3px rgba(22,119,242,.45)}
.gform{display:flex;flex-direction:column;gap:14px}
.gform .btn{width:100%}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:650;font-size:14px}
.field small{color:var(--muted);font-size:13px}
.inp{width:100%;min-height:52px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line-2);background:#fff;color:var(--ink);font:inherit;font-size:17px;box-shadow:0 2px 0 var(--line-2);transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(31,139,255,.18)}
.rule{margin:0;padding:12px 14px;border-radius:14px;background:var(--tint);border:1px solid var(--line);font-size:14.5px;line-height:1.45}
.rule b{color:var(--blue-d)}
.ustat{margin:0;font-size:14px;font-weight:650;min-height:20px;color:var(--muted)}
.ustat.ok{color:var(--good)}
.ustat.no{color:var(--bad)}
.gerr{margin:0;color:var(--bad);font-size:14px;font-weight:600}
.gerr:empty{display:none}
.showpw{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);font-weight:600;align-self:flex-start}
.showpw input{width:18px;height:18px;accent-color:var(--blue)}
.fine{margin:0;font-size:13px;color:var(--muted);text-align:center}
.acct{font-weight:700}
@media (max-width:520px){.chip.acct{display:none}}
.top .wrap{flex-wrap:wrap}
/* admin */
.admin{padding-block:6px 56px;display:flex;flex-direction:column;gap:20px}
.admin h1{margin:12px 0 0;font-size:clamp(32px,5vw,46px);letter-spacing:-.045em;line-height:1.05;font-weight:780}
.admin .lead{margin-top:8px;max-width:60ch}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{padding:16px 18px;border-radius:20px;border:1px solid var(--line);background:#fff}
.tile b{display:block;font-size:30px;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.tbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tbar .inp{max-width:320px;min-height:44px;font-size:16px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:20px;background:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;min-width:820px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--tint);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .u{font-weight:750}
.badge{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:99px;background:var(--tint-2);color:var(--blue-d);font-size:11px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;vertical-align:1px}
.mbar{display:inline-flex;align-items:center;gap:8px}
.mbar i{display:block;width:64px;height:6px;border-radius:9px;background:var(--tint-2);overflow:hidden}
.mbar i b{display:block;height:100%;background:var(--grad)}
.empty{margin:0;padding:28px;text-align:center;color:var(--muted)}
.nsm{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--tint-2);color:var(--faint)}
.nsm.on{background:var(--grad);color:#fff}
.nsm svg{width:14px;height:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;max-width:calc(100vw - 32px);
  padding:12px 18px;border-radius:999px;background:var(--ink);color:#fff;font-weight:650;font-size:14.5px;box-shadow:0 16px 30px -12px rgba(11,27,51,.5);animation:rise .35s ease both}
/* motion */
.sky::before{animation:drift1 20s ease-in-out infinite alternate}
.sky::after{animation:drift2 24s ease-in-out infinite alternate}
.grid{animation:gridpan 36s linear infinite}
.orb{position:absolute;width:560px;height:560px;left:30%;top:35%;border-radius:50%;
  background:radial-gradient(circle,rgba(56,168,255,.17),rgba(255,255,255,0) 65%);animation:drift3 26s ease-in-out infinite alternate}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 55ms)}
.wchip{animation:chipIn .5s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(.45s + var(--i,0) * 70ms);transition:transform .2s,border-color .2s}
.wchip:hover{transform:translateY(-3px) rotate(-2deg);border-color:var(--sky)}
.lrow{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.lrow:hover{transform:translateX(5px)}
.lrow.open .node{animation:nodePulse 2.2s ease-out infinite}
.lrow.done .node{transition:transform .25s}
.lrow:hover .node{transform:scale(1.08)}
.btn{position:relative;overflow:hidden;isolation:isolate}
.btn.shine::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(-130%);animation:shine 3.8s ease-in-out 1.4s infinite}
.flame{transform-origin:50% 90%;animation:flicker 2.2s ease-in-out infinite}
.flame.cold{filter:grayscale(1);opacity:.45;animation:none}
.week li.on i{animation:pop .45s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(.3s + var(--i,0) * 60ms)}
.float{animation:floatY 3.6s ease-in-out infinite}
.today .side{animation:floatY 3.6s ease-in-out infinite}
.listen .det{animation:wobble 4.5s ease-in-out infinite;transform-origin:50% 100%}
.startcard .art{animation:floatY 3.8s ease-in-out infinite}
.opt{animation:optIn .45s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(.14s + var(--i,0) * 55ms)}
.opt:hover:not(:disabled):not([aria-checked="true"]){border-color:var(--sky);transform:translateY(-2px);box-shadow:0 5px 0 var(--line-2)}
.opt.right{animation:bump .45s cubic-bezier(.3,1.5,.5,1)}
.prog span{position:relative;overflow:hidden}
.prog span::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
  transform:translateX(-100%);animation:progShine 2.6s ease-in-out infinite}
.bar{position:relative}
.barpeek{--pw:118px;--dh:0s;right:max(28px,8vw);z-index:3}
.bigstreak .flame{animation:pop .6s .2s both, flicker 2.2s 1s ease-in-out infinite}
.bigstreak b.bump{animation:bump .5s cubic-bezier(.3,1.5,.5,1)}
.done-art{animation:rise .5s ease both, floatY 3.6s .6s ease-in-out infinite}
.spark{position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:70;background:var(--c);
  animation:spark .75s cubic-bezier(.15,.8,.3,1) forwards}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
@keyframes headUp{from{transform:translateY(102%)}to{transform:none}}
/* hidden, then just the eyes peep over and glance side to side, then up he comes */
@keyframes peekaboo{0%{transform:translateY(102%)}28%{transform:translateY(29%)}36%{transform:translateY(29%) rotate(-6deg)}46%{transform:translateY(29%) rotate(6deg)}55%,62%{transform:translateY(29%) rotate(0)}100%{transform:none}}
@keyframes headDown{from{transform:none}to{transform:translateY(102%)}}
@keyframes headBob{0%,74%,100%{transform:none}80%,87%{transform:translateY(9%)}}
/* paw rises from under the edge (clipped at the edge line), lifts clear of it, then drops over the edge in front of the card */
@keyframes reach{0%{transform:translateY(calc(100% - var(--D)));clip-path:inset(0 0 100% 0)}
  42%{transform:translateY(calc(0% - var(--D)));clip-path:inset(0 0 0 0)}
  62%{transform:translateY(calc(-16% - var(--D)))}
  84%{transform:translateY(6%)}
  100%{transform:none}}
@keyframes pawTap{0%,88%,100%{transform:none}92%{transform:translateY(-14%)}96%{transform:none}}
@keyframes letGo{0%{transform:none;clip-path:inset(0 0 0 0)}30%{transform:translateY(calc(0% - var(--D)));clip-path:inset(0 0 0 0)}100%{transform:translateY(calc(100% - var(--D)));clip-path:inset(0 0 100% 0)}}
@keyframes floaty{from{transform:translateY(6px) rotate(-5deg)}to{transform:translateY(-16px) rotate(5deg)}}
@keyframes drift1{to{transform:translate(-140px,90px) scale(1.14)}}
@keyframes drift2{to{transform:translate(160px,-100px) scale(1.18)}}
@keyframes drift3{from{transform:translate(-35%,-25%)}to{transform:translate(25%,20%) scale(1.25)}}
@keyframes gridpan{to{background-position:44px 44px,44px 44px}}
@keyframes chipIn{from{opacity:.001;transform:translateY(8px) scale(.6)}to{opacity:1;transform:none}}
@keyframes nodePulse{0%{box-shadow:0 0 0 0 rgba(31,139,255,.4)}70%{box-shadow:0 0 0 13px rgba(31,139,255,0)}100%{box-shadow:0 0 0 0 rgba(31,139,255,0)}}
@keyframes shine{0%,55%{transform:translateX(-130%)}85%,100%{transform:translateX(130%)}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.07,.94) rotate(-4deg)}65%{transform:scale(.95,1.06) rotate(3deg)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px) rotate(1.5deg)}}
@keyframes wobble{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes stepIn{from{opacity:.001;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes optIn{from{opacity:.001;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes progShine{to{transform:translateX(100%)}}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(56,168,255,.55)}100%{box-shadow:0 0 0 16px rgba(56,168,255,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

  {t:"Meet Wunny", g:"Say hello and learn our mascot's name.", tip:"Cantonese has six tones. The small numbers show them: 1 is high and flat, 4 is the lowest. Listen closely to every word.", w:[

   ["你好","nei5 hou2","hello","你好，我係 Wunny！","nei5 hou2, ngo5 hai6 Wunny!","Hello, I'm Wunny!"],
   ["我","ngo5","I / me","我係浣熊。","ngo5 hai6 wun5 hung4.","I'm a raccoon."],
   ["你","nei5","you","你係浣熊？","nei5 hai6 wun5 hung4?","You're a raccoon?"],
   ["係","hai6","to be (am, is, are)","我係學生。","ngo5 hai6 hok6 saang1.","I'm a student."],
   ["好","hou2","good / very","你好叻！","nei5 hou2 lek1!","You're so smart!"]]},
  {t:"Thank you & sorry", g:"The polite words you'll use every day.", tip:"唔該 and 多謝 both mean thanks. Use 唔該 for a service or a favour. Use 多謝 for a gift or a compliment.", w:[

   ["多謝","do1 ze6","thank you (for a gift)","多謝你！","do1 ze6 nei5!","Thank you!"],
   ["唔好意思","m4 hou2 ji3 si1","excuse me / sorry (light)","唔好意思，我遲到。","m4 hou2 ji3 si1, ngo5 ci4 dou3.","Sorry, I'm late."],
   ["對唔住","deoi3 m4 zyu6","I'm sorry (apology)","對唔住，係我錯。","deoi3 m4 zyu6, hai6 ngo5 co3.","I'm sorry, it's my fault."],
   ["早晨","zou2 san4","good morning","早晨！你好嗎？","zou2 san4! nei5 hou2 maa3?","Morning! How are you?"],

  {t:"Yes, no, OK", g:"Agree, disagree, and say when you don't understand.", tip:"唔 (m4) makes things negative. 係 means yes, it is. 唔係 means no, it isn't.", w:[

   ["我哋","ngo5 dei6","we / us","我哋係學生。","ngo5 dei6 hai6 hok6 saang1.","We're students."],
   ["你哋","nei5 dei6","you (plural)","你哋好！","nei5 dei6 hou2!","Hi, everyone!"],
   ["佢哋","keoi5 dei6","they / them","佢哋喺屋企。","keoi5 dei6 hai2 uk1 kei2.","They're at home."],

   ["邊個","bin1 go3","who","佢係邊個？","keoi5 hai6 bin1 go3?","Who is he?"],
   ["識","sik1","to know (someone / how to)","我識佢。","ngo5 sik1 keoi5.","I know her."],

const KEY = "wunny.cantonese.v1";
const DEF = {streak:0, best:0, last:null, days:[], done:{}, xp:0, set:{auto:true, sfx:true, slow:false}};
let S = load();
function load(){
  try{ const r = localStorage.getItem(KEY); if(r){ const o = JSON.parse(r); return {...DEF, ...o, done:{...(o.done||{})}, days:[...(o.days||[])], set:{...DEF.set, ...(o.set||{})}}; } }catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function save(){ saveLocal(); syncUp(); }
const liveStreak = () => (S.last===today() || S.last===yesterday()) ? S.streak : 0;
const PREVIEW = () => location.hash === "#preview";
function nextIndex(){ for(let i=0;i<ALL.length;i++) if(!S.done[i]) return i; return -1; }
const didNewToday = () => Object.values(S.done).includes(today());
function lessonState(i){
  if(S.done[i]) return "done";
  if(PREVIEW()) return "open";
  if(i === nextIndex()) return didNewToday() ? "tomorrow" : "open";
  return "locked";
}

/* ---------- Voice ---------- */
const V = {ok:"speechSynthesis" in window, voice:null, list:[], status:"checking"};
// Rank the device's Cantonese voices: neural "Natural" / "Premium" / "Enhanced" voices sound far livelier than the basic ones.
function voiceScore(v){
  const n = v.name; let s = 0;
  if(/natural|neural|premium|enhanced/i.test(n)) s += 10;
  if(/online/i.test(n)) s += 3;
  if(/hiugaai|hiumaan|sinji|sin-ji/i.test(n)) s += 3;
  if(/google/i.test(n)) s += 2;
  if(v.localService === false) s += 1;
  return s;
}
function pickVoice(){
  if(!V.ok){ V.status="unsupported"; return; }
  const vs = speechSynthesis.getVoices();
  if(!vs.length) return;
  V.list = vs.filter(v => /^(zh[-_]HK|yue)/i.test(v.lang) || /cantonese|粵|廣東/i.test(v.name)).sort((a,b)=>voiceScore(b)-voiceScore(a));
  V.voice = V.list.find(v=>v.name===S.set.voice) || V.list[0] || null;
  V.status = V.voice ? "ready" : "none";
  renderVoiceBits();
}
if(V.ok){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
  setTimeout(()=>{ if(V.status==="checking"){ pickVoice(); if(V.status==="checking"){ V.status="none"; renderVoiceBits(); } } }, 1800);
} else V.status = "unsupported";

function speak(text, slow=false, btn=null){
  if(!V.ok || !text) return;
  try{
    speechSynthesis.cancel();
    document.querySelectorAll(".spk.on,.bigplay.on").forEach(b=>b.classList.remove("on"));
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-HK"; if(V.voice) u.voice = V.voice;
    u.rate = slow ? 0.62 : (S.set.slow ? 0.82 : 1);
    u.pitch = 1.12;
    if(btn){ btn.classList.add("on"); u.onend = u.onerror = () => btn.classList.remove("on"); }
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- Sound effects ---------- */
let AC = null;
function audioCtx(){ try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){} return AC; }
function tones(seq){
  if(!S.set.sfx) return; const ac = audioCtx(); if(!ac) return;
  const t0 = ac.currentTime + .01;
  seq.forEach(([f,st,d,type])=>{ const o=ac.createOscillator(), g=ac.createGain(); o.type=type||"sine"; o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t0+st); g.gain.exponentialRampToValueAtTime(.16,t0+st+.015); g.gain.exponentialRampToValueAtTime(.0001,t0+st+d);
    o.connect(g).connect(ac.destination); o.start(t0+st); o.stop(t0+st+d+.03); });
}
const sfxGood = () => tones([[784,0,.16],[1175,.09,.28]]);
const sfxBad  = () => tones([[262,0,.2,"triangle"],[196,.1,.3,"triangle"]]);
const sfxWin  = () => tones([[659,0,.18],[784,.12,.18],[988,.24,.18],[1319,.36,.45]]);

/* ---------- Motion helpers ---------- */
const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const FX_COLS = ["#1677f2","#38a8ff","#3fd0dc","#8fd0ff","#0b58c9"];
function sparkle(el){
  if(!el || calm()) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width*.5, cy = r.top + r.height*.5;
  for(let k=0;k<14;k++){

function confetti(){

      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.globalAlpha = Math.max(0, 1-k/3); x.fillStyle = p.c; x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore(); });
    if(k < 3.2) requestAnimationFrame(f); else c.remove();

}

}

const fxHTML = () => `<div class="fx" aria-hidden="true">${FLOAT.map(([c,x,y,sz,d,dl])=>`<span style="--x:${x};--y:${y};--s:${sz};--d:${d};--dl:${dl}">${c}</span>`).join("")}</div>`;
function heroTitle(t){ const p = t.split(" "); const last = p.pop(); return `${esc(p.join(" "))}${p.length?" ":""}<span class="g">${esc(last)}</span>`; }

function renderHome(){
  const nx = nextIndex(), ls = liveStreak(), doneN = Object.keys(S.done).length;
  const restToday = nx!==-1 && lessonState(nx)==="tomorrow";
  let hero;
  if(nx===-1){
    hero = `<div class="today rest rise">${fxHTML()}<img class="side" src="${ART.hug}" alt="">
      <span class="pill"><span class="dot"></span>Course complete</span>
      <h1>You made it to <span class="g">A1</span></h1>
      <p class="lead">All ${ALL.length} lessons done. Keep your streak going with a quick review each day.</p>
      <button class="btn shine" type="button" data-review="${Math.floor(Math.random()*ALL.length)}">Review a random lesson</button></div>`;
  } else if(restToday){
    const L = ALL[nx];
    hero = `<div class="today rest rise">${fxHTML()}<img class="side" src="${ART.hug}" alt="">
      <span class="pill"><span class="dot"></span>Done for today</span>
      <h1>See you <span class="g">tomorrow</span></h1>
      <p class="lead">Your streak is safe. Next up: <b>${esc(L.t)}</b>. Want more practice? Review any lesson below.</p>
      <button class="btn shine" type="button" data-review="${Math.max(0,nx-1)}">Review today's lesson</button></div>`;
  } else {
    const L = ALL[nx];
    hero = `<div class="today rise">${fxHTML()}${peekHTML()}
      <span class="pill"><span class="dot"></span>Day ${nx+1} of ${ALL.length} · about 10 min</span>
      <h1>${heroTitle(L.t)}</h1>
      <p class="lead">${esc(L.g)}</p>
      <div class="wchips" lang="zh-HK">${L.items.map((x,k)=>`<span class="wchip" style="--i:${k}">${esc(x.zh)}</span>`).join("")}</div>
      <button class="btn shine" type="button" data-start="${nx}">${doneN? "Start today's lesson" : "Start your first lesson"}</button></div>`;
  }
  const units = UNITS.map((u,ui)=>{
    const ls_ = ALL.filter(l=>l.ui===ui), d = ls_.filter(l=>S.done[l.i]).length;
    return `<section class="unit rise" style="--i:${ui+2}" aria-labelledby="u${ui}"><div class="unit-h"><small>Unit ${ui+1}</small><b id="u${ui}">${esc(u.n)}</b><em>${d} / ${ls_.length}</em></div>
      <ol class="lessons">${ls_.map(l=>{
        const st = lessonState(l.i);
        const node = st==="done" ? IC.check : st==="locked" ? IC.lock : (l.i+1);
        const act = st==="done" ? `<button class="ghost mini" type="button" data-review="${l.i}" aria-label="Review ${esc(l.t)}">Review</button>`
          : st==="open" ? `<button class="btn mini" type="button" data-start="${l.i}" aria-label="Start ${esc(l.t)}">Start</button>`
          : st==="tomorrow" ? `<span class="soon">Tomorrow</span>` : `<span class="soon">Day ${l.i+1}</span>`;
        return `<li class="lrow ${st} rise" style="--i:${l.i+3}"><span class="node" aria-hidden="true">${node}</span>
          <div class="ltxt"><b>${esc(l.t)}</b><span class="han" lang="zh-HK">${l.items.map(x=>esc(x.zh)).join(" · ")}</span></div>${act}</li>`;
      }).join("")}</ol></section>`;
  }).join("");

  $("#home").innerHTML = `
  <header class="top"><div class="wrap">
    <a class="brand" href="#" aria-label="Wunny home"><img src="${ART.logo}" alt=""><b>Wunny</b></a>
    <span class="chip" title="Day streak">${IC.flame("fg1", ls?"":"cold")}<span>${ls}</span><span class="sr">day streak</span></span>
    <span class="chip"><small>XP</small>${S.xp||0}</span>
    ${AUTH.profile ? `<button class="chip acct" type="button" id="acctChip" aria-label="Account settings">${esc(AUTH.profile.username)}</button>` : ""}
    ${AUTH.profile && AUTH.profile.admin ? `<button class="icon-btn" type="button" id="openAdmin" aria-label="Learners" title="Learners">${IC.people}</button>` : ""}
    <button class="icon-btn" type="button" id="openSet" aria-label="Settings">${IC.gear}</button>
  </div></header>
  <main class="wrap home">
    <div class="col-a">
      ${hero}
      <div class="streak rise" style="--i:2" aria-label="Your streak">
        <div class="streak-top">${IC.flame("fg2", ls?"":"cold")}
          <div><div class="snum">${ls}</div><div class="slab">day streak</div></div>
          <div class="sbest"><b>${Math.max(S.best||0, ls)}</b>best streak</div></div>
        ${weekHTML()}
      </div>
      <div id="vslot">${voiceNoteHTML()}</div>
    </div>

function armPeek(pk){

/* ---------- Lesson session ---------- */
let Q = null;
const cur = () => Q.steps[Q.i];

function distractors(item, n, by){
  const top = Math.max(item.li, Q.L.i);
  const pool = ALL.slice(0, top+1).flatMap(l=>l.items);
  const ok = c => c!==item && !related(c,item) && c.en!==item.en;
  const same = shuffle(pool.filter(c=>c.li===item.li && ok(c)));
  const other = shuffle(pool.filter(c=>c.li!==item.li && ok(c)));
  const out = [], seen = new Set([item[by]]);
  const take = (arr,max) => { for(const c of arr){ if(out.length>=max) break; if(seen.has(c[by])) continue; if(out.some(o=>related(o,c))) continue; seen.add(c[by]); out.push(c); } };
  take(same, 2); take(other, n); take(same, n);
  return out.slice(0, n);
}
function spread(a){
  a = shuffle(a);
  for(let k=1;k<a.length;k++){
    if(a[k].it===a[k-1].it){ const j = a.findIndex((x,m)=>m>k && x.it!==a[k-1].it && x.it!==(a[k+1]||{}).it); if(j>0) [a[k],a[j]]=[a[j],a[k]]; }
  }
  return a;
}
function buildSteps(L, mode){
  const it = L.items, s = [];
  if(mode==="new"){
    s.push({t:"start"});
    for(let k=0;k<it.length;k+=2){ const p = it.slice(k,k+2); p.forEach(x=>s.push({t:"intro",it:x})); p.forEach(x=>s.push({t:"meaning",it:x})); }
  }
  const pr = [];
  it.forEach(x=>{ pr.push({t:"listen",it:x}); pr.push({t:"reverse",it:x}); });
  shuffle(it).slice(0,4).forEach(x=>pr.push({t:"context",it:x}));
  if(mode==="new") shuffle(it).slice(0,2).forEach(x=>pr.push({t:"speak",it:x}));
  else it.forEach(x=>pr.push({t:"meaning",it:x}));
  shuffle(ALL.slice(0,L.i).flatMap(l=>l.items)).slice(0,4)
    .forEach(x=>pr.push({t:pick(["meaning","listen","reverse","context"]), it:x, review:true}));
  return s.concat(spread(pr));
}

function startLesson(i, mode){
  const L = ALL[i];
  Q = {L, mode, steps:buildSteps(L,mode), i:0, sel:null, checked:false, good:0, graded:0, combo:0, xp:0, retries:{}, fixAnnounced:false, t0:Date.now()};
  audioCtx();
  if(V.ok){ try{ speechSynthesis.cancel(); }catch(e){} }
  show("lesson");
  renderStep();
}

function optsHTML(st, kind){
  return `<div class="opts" role="radiogroup" aria-label="Answer choices">${st.opts.map((o,k)=>
    `<button class="opt" type="button" role="radio" aria-checked="false" data-k="${k}" style="--i:${k}"><span class="key" aria-hidden="true">${k+1}</span><span class="olab">${
      kind==="en" ? `<span class="oen">${esc(o.en)}</span>` : `<span class="ozh" lang="zh-HK">${esc(o.zh)}</span><span class="ojp">${jpHTML(o.jp)}</span>`
    }</span></button>`).join("")}</div>`;
}
function blankSentence(it){
  const zh = it.ex.zh, k = zh.indexOf(it.zh);
  const zhH = k<0 ? esc(zh) : esc(zh.slice(0,k)) + `<span class="blank" aria-label="blank"></span>` + esc(zh.slice(k+it.zh.length));
  const re = new RegExp("(^|[^a-z0-9])" + it.jp.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "(?=[^a-z0-9]|$)");
  const m = it.ex.jp.match(re);
  let jpH = "";
  if(m){ const s = m.index + m[1].length; jpH = jpHTML(it.ex.jp.slice(0,s)) + "____" + jpHTML(it.ex.jp.slice(s+it.jp.length)); }
  return {zhH, jpH};
}
function fullSentence(it){
  const zh = it.ex.zh, k = zh.indexOf(it.zh);
  return k<0 ? esc(zh) : esc(zh.slice(0,k)) + `<mark>${esc(it.zh)}</mark>` + esc(zh.slice(k+it.zh.length));
}

function setProgress(){
  const p = Math.round(Q.i / Q.steps.length * 100);
  $("#prog span").style.width = p + "%"; $("#prog").setAttribute("aria-valuenow", p);
}
function resetBar(){
  $("#bar").classList.remove("good","bad"); $("#fb").innerHTML = "";
  clearTimeout(peekTimer); $("#barPeek").hidden = true; $("#barPeek").classList.remove("out");
  $("#ctxBtn").hidden = true;

}

function renderStep(){
  const st = cur(), it = st.it, L = Q.L;
  Q.sel = null; Q.checked = false;
  setProgress(); resetBar();
  const tag = st.retry ? "Fix a mistake" : st.review ? "Quick review" : null;
  const tagH = tag ? `<span class="pill"><span class="dot"></span>${tag}</span>` : "";
  let h = "", primary = "Check", needSel = false, say = null, sayBtn = ".stage .main";

  if(st.t==="start"){
    h = `<div class="startcard"><img class="art" src="${ART.detective}" alt="Wunny holding a magnifying glass">
      <div class="qtop"><span class="pill"><span class="dot"></span>Lesson ${L.i+1} · ${esc(L.unit)}</span></div>
      <div><h2 class="qh" style="font-size:clamp(30px,5.4vw,44px);letter-spacing:-.045em">${esc(L.t)}</h2><p class="lead" style="margin-top:8px">${esc(L.g)}</p></div></div>
      <div class="tip"><strong>Wunny's tip</strong><p>${esc(L.tip)}</p></div>
      <div class="wchips" lang="zh-HK" aria-label="Words in this lesson">${L.items.map((x,k)=>`<span class="wchip" style="--i:${k}">${esc(x.zh)}</span>`).join("")}</div>`;
    primary = "Let's go";
  }
  else if(st.t==="intro"){
    h = `<div class="qtop"><span class="pill"><span class="dot"></span>New word</span>${tagH}</div>
      <h2 class="qh sr">New word: ${esc(it.en)}</h2>
      <div class="word"><div class="zh" lang="zh-HK">${esc(it.zh)}</div><div class="jp">${jpHTML(it.jp)}</div><div class="en">${esc(it.en)}</div>
      <div class="audio">${spkBtn(it.zh,"Play "+it.en+" in Cantonese","main")}${slowBtn(it.zh)}</div></div>`;
    primary = "Continue"; $("#ctxBtn").hidden = false;
    if(S.set.auto) say = it.zh;
  }
  else if(st.t==="meaning"){
    st.opts = st.opts || shuffle([it, ...distractors(it,3,"en")]);
    h = `<div class="qtop">${tagH}</div><h2 class="qh">What does this mean?</h2>
      <div class="word compact"><div class="zh" lang="zh-HK">${esc(it.zh)}</div><div class="jp">${jpHTML(it.jp)}</div>
      <div class="audio">${spkBtn(it.zh,"Play the word","sm main")}</div></div>${optsHTML(st,"en")}`;
    needSel = true; if(S.set.auto) say = it.zh;
  }
  else if(st.t==="listen"){
    st.opts = st.opts || shuffle([it, ...distractors(it,3,"zh")]);
    h = `<div class="qtop">${tagH}</div><h2 class="qh">What did you hear?</h2>
      <div class="listen"><img class="det" src="${ART.detective}" alt="">
      <button class="bigplay main" type="button" data-say="${esc(it.zh)}" aria-label="Play the audio">${IC.spk}</button>${slowBtn(it.zh)}</div>
      ${optsHTML(st,"zh")}`;
    needSel = true; say = it.zh;
  }
  else if(st.t==="reverse"){
    st.opts = st.opts || shuffle([it, ...distractors(it,3,"zh")]);
    h = `<div class="qtop">${tagH}</div><h2 class="qh">How do you say “${esc(it.en)}”?</h2>${optsHTML(st,"zh")}`;
    needSel = true;
  }
  else if(st.t==="context"){
    st.opts = st.opts || shuffle([it, ...distractors(it,3,"zh")]);
    const b = blankSentence(it);
    h = `<div class="qtop">${tagH}</div><h2 class="qh">Fill the gap</h2>
      <div class="sent" id="sent"><div class="szh" lang="zh-HK">${b.zhH}</div>${b.jpH?`<div class="sjp">${b.jpH}</div>`:""}<div class="sen">“${esc(it.ex.en)}”</div></div>
      ${optsHTML(st,"zh")}`;
    needSel = true;
  }
  else if(st.t==="speak"){
    h = `<div class="qtop">${tagH}</div><h2 class="qh">Say it out loud</h2>
      <p class="lead">Listen, then say it three times. Try to match the tone.</p>
      <div class="word"><div class="zh" lang="zh-HK">${esc(it.zh)}</div><div class="jp">${jpHTML(it.jp)}</div><div class="en">${esc(it.en)}</div>
      <div class="audio">${spkBtn(it.zh,"Play "+it.en+" in Cantonese","main")}${slowBtn(it.zh)}</div></div>`;
    primary = "I said it"; say = it.zh;
  }

  if(st.retry && !Q.fixAnnounced){ Q.fixAnnounced = true; }
  const stage = $("#stageIn"); stage.innerHTML = h; $("#stage").scrollTop = 0;
  const p = $("#primary"); p.textContent = primary; p.disabled = needSel;
  const hd = stage.querySelector(".qh"); if(hd){ hd.tabIndex = -1; hd.focus({preventScroll:true}); }

function select(k){
  if(Q.checked) return;
  const st = cur(); if(!st.opts || !st.opts[k]) return;
  Q.sel = k;
  document.querySelectorAll(".opt").forEach((b,j)=>b.setAttribute("aria-checked", j===k ? "true" : "false"));
  $("#primary").disabled = false;
  if(st.t==="reverse" || st.t==="context") speak(st.opts[k].zh);
}

function check(){
  const st = cur(), it = st.it, ok = st.opts[Q.sel] === it;
  Q.checked = true;
  document.querySelectorAll(".opt").forEach((b,k)=>{ b.disabled = true; if(st.opts[k]===it) b.classList.add("right"); else if(k===Q.sel) b.classList.add("wrong"); });
  if(!st.retry){ Q.graded++; if(ok) Q.good++; }
  if(ok){ Q.combo++; Q.xp += st.retry ? 5 : 10; sfxGood(); const rb = document.querySelector(".opt.right"); if(rb) sparkle(rb); if(Q.combo===3 || Q.combo===5 || (Q.combo>5 && Q.combo%4===0)) barPeek(); }
  else {
    Q.combo = 0; sfxBad();
    const key = st.t + "|" + it.zh, n = Q.retries[key] || 0;
    if(n < 2){ Q.retries[key] = n+1; Q.steps.push({t:st.t, it, retry:true}); }
  }
  const c = $("#combo");
  if(ok && Q.combo >= 3){ c.textContent = `${Q.combo} in a row`; c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); } else c.textContent = "";
  if(st.t==="context"){ const s = $("#sent .szh"); if(s) s.innerHTML = fullSentence(it); const j = $("#sent .sjp"); if(j) j.innerHTML = jpHTML(it.ex.jp); }
  showFeedback(ok, it);
  setTimeout(()=>speak(st.t==="context" ? it.ex.zh : it.zh), 380);
}

function showFeedback(ok, it, custom){
  const bar = $("#bar"); bar.classList.add(ok ? "good" : "bad");
  const head = custom || (ok ? pick(["Nice!","Correct!","You got it!","Great ear!","Spot on!","That's it!"]) : "Not quite.");
  const line = custom ? "Saying words out loud locks in the tones."
    : `${ok?"":"Correct answer: "}<span class="fzh" lang="zh-HK">${esc(it.zh)}</span> <span>${jpHTML(it.jp)}</span> · ${esc(it.en)}`;
  $("#fb").innerHTML = `<span class="fb-ic">${ok?IC.check:IC.x}</span><div class="fb-t"><strong>${head}</strong><span>${line}</span></div>`;
  $("#ctxBtn").hidden = false;
  const p = $("#primary"); p.textContent = "Continue"; p.disabled = false; p.classList.add(ok ? "ok" : "no"); p.focus({preventScroll:true});
}

function onPrimary(){
  if(!Q) return;
  const st = cur();
  if(st.t==="start" || st.t==="intro") return next();
  if(st.t==="speak"){
    if(!Q.checked){ Q.checked = true; Q.xp += 5; sfxGood(); showFeedback(true, st.it, pick(["Sounding good!","Great job!","Nice tones!"])); sparkle($(".stage .word")); }
    else next();
    return;
  }
  if(!Q.checked){ if(Q.sel==null) return; check(); } else next();
}
function next(){
  Q.i++;
  if(Q.i >= Q.steps.length) return finish();
  renderStep();
}

/* ---------- Finish ---------- */
function streakArt(n){
  const keys = Object.keys(STREAK_ART).map(Number).filter(k=>k<=n).sort((a,b)=>b-a);
  return keys.length ? STREAK_ART[keys[0]] : ART.hug;
}
function finish(){
  const secs = Math.round((Date.now()-Q.t0)/1000), before = liveStreak(), t = today();
  if(S.last !== t){ S.streak = (S.last===yesterday()) ? S.streak+1 : 1; S.last = t; if(!S.days.includes(t)) S.days.push(t); S.days = S.days.slice(-120); }
  S.best = Math.max(S.best||0, S.streak);
  if(Q.mode==="new" && !S.done[Q.L.i]) S.done[Q.L.i] = t;
  Q.xp += 20; S.xp = (S.xp||0) + Q.xp;
  save();
  const grew = S.streak > before, acc = Q.graded ? Math.round(Q.good/Q.graded*100) : 100;
  const nx = nextIndex();
  const nextLine = nx===-1 ? "You've finished every lesson. Keep reviewing to hold your streak."
    : `Next up tomorrow: <b>${esc(ALL[nx].t)}</b>. Come back to keep your streak going.`;
  $("#doneIn").innerHTML = `
    <img class="done-art" src="${streakArt(S.streak)}" alt="Wunny celebrating">
    <div class="bigstreak">${IC.flame("fg3")}<b id="dStreak">${S.streak}</b></div>
    <p class="slab" style="margin:-8px 0 0">${grew ? (S.streak===1 ? "Day 1. Your streak starts now!" : `${S.streak}-day streak! Keep it going.`) : "Your streak is already safe today."}</p>
    <h1>${Q.mode==="new" ? `Lesson <span class="g">complete</span>` : `Review <span class="g">complete</span>`}</h1>
    <div class="stats">
      <div class="stat"><b id="dXp">+${Q.xp}</b><span>XP</span></div>
      <div class="stat"><b id="dAcc">${acc}%</b><span>Accuracy</span></div>
      <div class="stat"><b>${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}</b><span>Time</span></div>
    </div>
    <ul class="wlist" aria-label="Words from this lesson">${Q.L.items.map(x=>`<li>${spkBtn(x.zh,"Play "+x.en,"sm")}<span class="han" lang="zh-HK">${esc(x.zh)}</span><span class="m"><span>${jpHTML(x.jp)}</span><span>${esc(x.en)}</span></span></li>`).join("")}</ul>
    <p class="lead">${nextLine}</p>
    <button class="btn shine" type="button" id="backHome">Back to home</button>`;
  show("done"); sfxWin(); confetti();
  countUp($("#dXp"), 0, Q.xp, 1000, v=>"+"+v); countUp($("#dAcc"), 0, acc, 1000, v=>v+"%");
  if(grew && !calm()){ const b = $("#dStreak"); b.textContent = before; setTimeout(()=>{ b.textContent = S.streak; b.classList.add("bump"); sfxGood(); }, 900); }
  Q = null;
}

async function api(path, {method="GET", body}={}){
  const ctl = new AbortController(), timer = setTimeout(()=>ctl.abort(), 12000);
  try{
    const r = await fetch(API + path, {method, signal:ctl.signal,
      headers:{"Content-Type":"application/json", ...(AUTH.token ? {Authorization:"Bearer " + AUTH.token} : {})},
      body: body ? JSON.stringify(body) : undefined});
    let data = {}; try{ data = await r.json(); }catch(e){}
    if(!r.ok){ const err = new Error(data.error || "Something went wrong. Try again."); err.status = r.status; throw err; }
    return data;
  }catch(e){
    if(e.status) throw e;
    const err = new Error("Wunny couldn't connect. Check your internet and try again."); err.status = 0; throw err;
  }finally{ clearTimeout(timer); }
}

    <form class="gform" id="signupForm" novalidate>
      <div class="field"><label for="suUser">Username</label>
        <p class="rule" id="suRule">Type your <b>first name and last name</b> as one word, all lowercase. No spaces, numbers or symbols. Vinci Lo would type <b>vincilo</b>.</p>
        <input class="inp" id="suUser" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="32" placeholder="firstnamelastname" aria-describedby="suRule uStat">
        <p class="ustat" id="uStat" aria-live="polite"></p></div>
      <div class="field"><label for="suPass">Password</label>
        <input class="inp" id="suPass" type="password" autocomplete="new-password" aria-describedby="suPassHint"><small id="suPassHint">At least 8 characters.</small></div>
      <div class="field"><label for="suPass2">Type your password again</label>
        <input class="inp" id="suPass2" type="password" autocomplete="new-password"></div>
      ${pw}
      <p class="gerr" id="gErr" role="alert">${esc(msg)}</p>
      <button class="btn shine" type="submit">Create my account</button>
      <p class="fine">Your progress saves to your account. The Wunny team can see learners' progress.</p>
    </form>`;
  return `<span class="pill"><span class="dot"></span>Welcome back</span>
    <h2 id="authTitle">Log in to <span class="g">Wunny</span></h2>
    <p class="lead">Pick up right where you left off.</p>${tabs}
    <form class="gform" id="loginForm" novalidate>
      <div class="field"><label for="liUser">Username</label>
        <input class="inp" id="liUser" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="32" placeholder="firstnamelastname"></div>
      <div class="field"><label for="liPass">Password</label>
        <input class="inp" id="liPass" type="password" autocomplete="current-password"></div>
      ${pw}
      <p class="gerr" id="gErr" role="alert">${esc(msg)}</p>
      <button class="btn shine" type="submit">Log in</button>
      <p class="fine">Forgot your password? Ask the Wunny team to reset it for you.</p>
    </form>`;
}

function openAuth(mode="signup", msg=""){
  const d = $("#authDlg");
  $("#gIn").innerHTML = authHTML(mode, msg);
  if(!d.open){
    d.showModal();
    const card = $("#gCard"), old = card.querySelector(".peek"); if(old) old.remove();
    card.insertAdjacentHTML("afterbegin", peekHTML()); armPeek(card.querySelector(".peek"));
  }
  const f = $("#gIn input.inp"); if(f) f.focus({preventScroll:true});
}
const gErr = t => { const el = $("#gErr"); if(el) el.textContent = t; };

async function submitAuth(form){
  const btn = form.querySelector('button[type="submit"]'), label = btn.textContent;
  const busy = (on, txt) => { btn.disabled = on; btn.textContent = on ? txt : label; };
  gErr("");
  if(form.id==="signupForm"){
    const u = $("#suUser").value.trim(), p = $("#suPass").value, p2 = $("#suPass2").value;
    if(!u) return gErr("Enter a username: your first and last name together, like vincilo.");
    if(!/^[a-z]+$/.test(u)) return gErr("Usernames can only use lowercase English letters, a to z.");
    if(u.length < 2) return gErr("That username looks too short. Use your first and last name together.");
    if(p.length < 8) return gErr("Your password needs at least 8 characters.");
    if(p !== p2) return gErr("The two passwords don't match. Type them again.");
    busy(true, "Creating your account…");
    try{
      const hasLocal = Object.keys(S.done).length > 0 || (S.xp||0) > 0;
      signedIn(await api("/signup", {method:"POST", body:{username:u, password:p, progress: hasLocal ? S : null}}), true);
    }catch(e){ busy(false); gErr(e.message); }
  } else {
    const u = $("#liUser").value.trim().toLowerCase(), p = $("#liPass").value;
    if(!u || !p) return gErr("Enter your username and password.");
    busy(true, "Logging in…");
    try{ signedIn(await api("/login", {method:"POST", body:{username:u, password:p}}), false); }
    catch(e){ busy(false); gErr(e.message); }
  }
}

function signedIn(r, isNew){
  if(r.token){ AUTH.token = r.token; lsSet(TOKEN_KEY, r.token); }
  AUTH.profile = r.user;
  mergeProgress(r.progress);
  const d = $("#authDlg"); if(d.open) d.close();
  if(!$("#home").hidden) renderHome();
  toast(isNew ? `Welcome to Wunny, ${r.user.username}!` : `Welcome back, ${r.user.username}!`);
  if(isNew){ sfxWin(); confetti(); }
}

// Keep whichever copy of progress is further along: this device or the account.
function mergeProgress(p){
  const rank = x => [Object.keys(x.done||{}).length, x.last||"", x.xp||0];
  if(p && typeof p === "object"){
    const a = rank(p), b = rank(S);
    const accountAhead = a[0] > b[0] || (a[0] === b[0] && (a[1] > b[1] || (a[1] === b[1] && a[2] >= b[2])));
    if(accountAhead){ S = {...DEF, ...p, done:{...(p.done||{})}, days:[...(p.days||[])], set:{...DEF.set, ...(p.set||{})}}; saveLocal(); return; }
  }
  syncUp();
}
let syncT = 0;
function syncUp(){
  if(!AUTH.on || !AUTH.profile) return;
  clearTimeout(syncT);
  syncT = setTimeout(()=>{ api("/progress", {method:"PUT", body:{progress:S}}).catch(e=>{ if(e.status===401) expired(); }); }, 600);
}
function expired(){
  AUTH.token = null; AUTH.profile = null; lsSet(TOKEN_KEY, null);
  openAuth("login", "You've been logged out. Please log in again.");
}
async function logout(){
  try{ await api("/logout", {method:"POST"}); }catch(e){}
  AUTH.token = null; AUTH.profile = null; lsSet(TOKEN_KEY, null);
  S = JSON.parse(JSON.stringify(DEF)); saveLocal();
  $("#setDlg").close(); show("home"); openAuth("login");
}

document.addEventListener("submit", e=>{
  const f = e.target.closest("form"); if(!f) return;
  if(f.id==="resetForm"){ e.preventDefault(); return resetPassword(f); }
  if(f.classList.contains("gform")){ e.preventDefault(); submitAuth(f); }
});
document.addEventListener("change", e=>{
  if(!e.target.matches("[data-showpw]")) return;
  e.target.closest("form").querySelectorAll('input[type="password"],input[data-pw]').forEach(i=>{ i.dataset.pw = "1"; i.type = e.target.checked ? "text" : "password"; });
});
document.addEventListener("input", e=>{
  const id = e.target.id;
  if(id==="adminSearch"){ adminQ = e.target.value.trim().toLowerCase(); const t = $("#adminTbl"); if(t) t.innerHTML = adminTable(); return; }
  if(id!=="suUser" && id!=="liUser") return;
  const v = e.target.value.toLowerCase().replace(/\s+/g,""); if(v !== e.target.value) e.target.value = v;
  if(id!=="suUser") return;
  const st = $("#uStat");
  if(!v){ st.className = "ustat"; st.textContent = ""; }
  else if(/[^a-z]/.test(v)){ st.className = "ustat no"; st.textContent = "Only lowercase letters a to z. Take out numbers, symbols or accents."; }
  else { st.className = "ustat ok"; st.textContent = `Your username will be ${v}`; }
});

/* ---------- Admin: learners ---------- */
let LEARNERS = [], adminQ = "", adminState = "loading", adminErr = "";
function lstats(p){
  p = p || {};
  const live = (p.last===today() || p.last===yesterday()) ? (p.streak||0) : 0;
  return {done:Object.keys(p.done||{}).length, live, best:Math.max(p.best||0, live), xp:p.xp||0, last:p.last||null, days:(p.days||[]).length};
}
function fmtDay(k){
  if(!k) return "Never";
  if(k===today()) return "Today";
  if(k===yesterday()) return "Yesterday";
  const [y,m,d] = k.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString("en",{month:"short", day:"numeric", year: y!==new Date().getFullYear() ? "numeric" : undefined});
}
const fmtDate = ms => ms ? new Date(ms).toLocaleDateString("en",{month:"short", day:"numeric", year:"numeric"}) : "—";

function adminTable(){
  if(adminState==="loading") return `<p class="empty">Loading learners…</p>`;
  if(adminState==="error") return `<p class="empty">${esc(adminErr)}</p>`;
  const rows = LEARNERS.map(l=>({...l, s:lstats(l.progress)}))
    .filter(l=>!adminQ || l.username.includes(adminQ))
    .sort((a,b)=>(b.s.last||"").localeCompare(a.s.last||"") || b.s.done - a.s.done || (b.lastSeen||0) - (a.lastSeen||0));
  if(!rows.length) return `<p class="empty">${LEARNERS.length ? "No usernames match your search." : "No one has signed up yet."}</p>`;
  return `<table class="tbl"><thead><tr><th scope="col">Username</th><th scope="col">Lessons</th><th scope="col">Streak</th><th scope="col">Best</th><th scope="col">XP</th><th scope="col">Days practised</th><th scope="col">Last practised</th><th scope="col">Joined</th><th scope="col"><span class="sr">Details</span></th></tr></thead>
    <tbody>${rows.map(l=>`<tr><td class="u">${esc(l.username)}${l.admin ? '<span class="badge">Admin</span>' : ""}</td>
      <td><span class="mbar"><i><b style="width:${l.s.done/ALL.length*100}%"></b></i>${l.s.done}/${ALL.length}</span></td>
      <td>${l.s.live}</td><td>${l.s.best}</td><td>${l.s.xp}</td><td>${l.s.days}</td><td>${fmtDay(l.s.last)}</td><td>${fmtDate(l.created)}</td>
      <td><button class="ghost mini" type="button" data-learner="${esc(l.username)}">Details</button></td></tr>`).join("")}</tbody></table>`;
}
function renderAdmin(){
  const all = LEARNERS.map(l=>lstats(l.progress)), n = all.length;
  const tile = (v,l) => `<div class="tile"><b>${v}</b><span>${l}</span></div>`;
  $("#admin").innerHTML = `<header class="top"><div class="wrap">
      <a class="brand" href="#" aria-label="Wunny home"><img src="${ART.logo}" alt=""><b>Wunny</b></a>
      <button class="ghost mini" type="button" id="adminBack">Back to learning</button></div></header>
    <main class="wrap admin">
      <div class="rise"><span class="pill"><span class="dot"></span>Admin · ${esc(AUTH.profile ? AUTH.profile.username : "")}</span>
        <h1>Learners</h1><p class="lead">Everyone who has signed up and how they're doing. Only admins can see this page.</p></div>
      <div class="tiles rise" style="--i:1">${tile(n,"Learners")}${tile(all.filter(s=>s.last===today()).length,"Practised today")}${tile(n ? (all.reduce((a,s)=>a+s.done,0)/n).toFixed(1) : "0","Avg lessons done")}${tile(all.filter(s=>s.done>=ALL.length).length,`Finished all ${ALL.length}`)}</div>
      <div class="tbar rise" style="--i:2"><label class="sr" for="adminSearch">Search learners</label>
        <input class="inp" id="adminSearch" type="search" placeholder="Search usernames" value="${esc(adminQ)}" autocapitalize="none" spellcheck="false">
        <button class="ghost mini" type="button" id="adminRefresh">Refresh</button></div>
      <div class="tbl-wrap rise" style="--i:3" id="adminTbl">${adminTable()}</div>
    </main>`;
}
async function openAdmin(){
  if(!AUTH.profile || !AUTH.profile.admin) return;
  adminState = "loading"; show("admin");
  try{ LEARNERS = (await api("/admin/learners")).learners || []; adminState = "ready"; }
  catch(e){ if(e.status===401) return expired(); adminState = "error"; adminErr = e.message; }
  if(!$("#admin").hidden) renderAdmin();
}
function openLearner(name){
  const l = LEARNERS.find(x=>x.username===name); if(!l) return;
  const p = l.progress || {}, s = lstats(p), done = p.done || {};
  $("#lrnIn").innerHTML = `<div class="dlg-h"><h2 id="lrnTitle">${esc(l.username)}${l.admin ? '<span class="badge">Admin</span>' : ""}</h2>
      <button class="icon-btn" type="button" data-close aria-label="Close">${IC.x}</button></div>
    <div class="stats"><div class="stat"><b>${s.live}</b><span>Streak</span></div><div class="stat"><b>${s.best}</b><span>Best</span></div><div class="stat"><b>${s.xp}</b><span>XP</span></div></div>
    <p class="vstat" style="margin:0">Joined ${fmtDate(l.created)} · Last practised ${fmtDay(s.last)} · Last visit ${fmtDate(l.lastSeen)} · ${s.days} day${s.days===1?"":"s"} practised</p>
    <ul class="wlist" aria-label="Lessons">${ALL.map(L=>`<li><span class="nsm ${done[L.i] ? "on" : ""}" aria-hidden="true">${done[L.i] ? IC.check : L.i+1}</span>
      <span>${esc(L.t)}</span><span class="m">${done[L.i] ? "Done " + fmtDay(done[L.i]) : "Not yet"}</span></li>`).join("")}</ul>
    <form id="resetForm" class="field" novalidate data-user="${esc(l.username)}" style="gap:10px">
      <label for="rpPass">Set a new password for ${esc(l.username)}</label>
      <input class="inp" id="rpPass" type="text" autocomplete="off" spellcheck="false"><small>At least 8 characters. Share it with them privately.</small>
      <p class="gerr" id="rpErr" role="alert"></p>
      <button class="ghost" type="submit" style="align-self:flex-start">Reset password</button></form>`;
  $("#learnerDlg").showModal();
}
async function resetPassword(f){
  const pw = $("#rpPass").value, err = $("#rpErr"), b = f.querySelector("button");
  err.textContent = "";
  if(pw.length < 8){ err.textContent = "Use at least 8 characters."; return; }
  b.disabled = true;
  try{ await api("/admin/reset", {method:"POST", body:{username:f.dataset.user, password:pw}}); $("#learnerDlg").close(); toast(`Password reset for ${f.dataset.user}`); }
  catch(e){ err.textContent = e.message; }
  b.disabled = false;
}

/* ---------- Start ---------- */
async function boot(){
  AUTH.token = lsGet(TOKEN_KEY);
  renderHome();
  try{ const h = await api("/health"); AUTH.on = !!(h && h.ok); }catch(e){ AUTH.on = false; }
  if(!AUTH.on) return;
  if(AUTH.token){
    try{ const r = await api("/me"); AUTH.profile = r.user; mergeProgress(r.progress); if(!$("#home").hidden) renderHome(); return; }
    catch(e){ if(e.status!==401) return; AUTH.token = null; lsSet(TOKEN_KEY, null); }
  }
  openAuth("signup");
}
boot();
</script>
